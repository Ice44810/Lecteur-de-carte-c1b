[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tachy-linux"
version = "0.1.0"
description = "Application desktop Linux de lecture, archivage et analyse de donnees tachygraphiques (C1B / V1B)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "tachy-linux contributors" }]
keywords = ["tachograph", "tachygraphe", "c1b", "v1b", "pcsc", "transport"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Other Audience",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

dependencies = [
    "PySide6>=6.6",
    "SQLAlchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "openpyxl>=3.1",
    "reportlab>=4.0",
]

[project.optional-dependencies]
# PC/SC support requires the system packages pcscd and libpcsclite-dev.
# See docs/INSTALL_LINUX.md before installing this extra.
pcsc = ["pyscard>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[project.scripts]
tachy-linux = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "ui: tests instantiating PySide6 widgets (require a Qt platform plugin)",
    "pcsc: tests requiring a real PC/SC stack (skipped by default)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "app/ui/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "D"]
# D401 verifie le mode imperatif sur des heuristiques anglaises : les docstrings du
# projet sont en francais. D107 est couvert autrement : les arguments de __init__ sont
# documentes dans la docstring de la classe, conformement au style Google.
ignore = ["D203", "D213", "D401", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
# Les declarations Protocol n'ont pas de corps a documenter : la docstring de la
# classe decrit le contrat.
"app/database/repositories/interfaces.py" = ["D102"]
# Frontieres avec des bibliotheques non typees (SQLAlchemy, pyscard) : le type reel
# n'est pas connaissable statiquement a cet endroit precis.
"app/card_reader/pcsc_reader.py" = ["ANN401"]
"app/database/database.py" = ["ANN401"]
"app/database/models/types.py" = ["ANN401"]
"app/database/repositories/base.py" = ["ANN401"]
"app/analysis/rules/base.py" = ["ANN401"]
